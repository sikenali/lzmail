services:
  lzmail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_BASE_IMAGE: ${GO_BASE_IMAGE:-golang:1.25-alpine}
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: lzmail:latest
    container_name: lzmail-app
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - lzmail_data:/app/data
      - lzmail_archives:/app/archives
    environment:
      # 后端配置
      - BACKEND_PORT=8080
      - FRONTEND_PORT=3000
      - DATA_DIR=/app/data
      - ARCHIVE_DIR=/app/archives

      # 存储上限（GB），数据目录与归档目录各自单独挂载
      - STORAGE_LIMIT_GB=${STORAGE_LIMIT_GB:-50}

      # 时区
      - TZ=${TZ:-Asia/Shanghai}

      # 运行环境
      - NODE_ENV=production
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      - "com.lzmail.description=LZMail Email Client"
      - "com.lzmail.version=0.0.99"

volumes:
  lzmail_data:
    driver: local
  lzmail_archives:
    driver: local

networks:
  default:
    name: lzmail_network
