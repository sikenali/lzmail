application:
  subdomain: lzmail
  routes:
    - /api/=exec://8080,/lzcapp/pkg/content/backend/lzmail
    - /=file:///lzcapp/pkg/content/frontend
  environment:
    BACKEND_PORT: "8080"
    FRONTEND_PORT: "3000"
    DATA_DIR: /lzcapp/var/data
    ARCHIVE_DIR: /lzcapp/var/archives
    STORAGE_LIMIT_GB: "50"
    TZ: Asia/Shanghai
    NODE_ENV: production
  health_check:
    test_url: http://127.0.0.1:8080/api/v1/health
    start_period: 40s
    timeout: 10s
